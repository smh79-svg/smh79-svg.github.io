---
layout: default
---

<style>
  html, body {
    margin: 0 !important;
    padding: 0 !important;
    width: 100%;
    height: 100%;
    overflow: hidden; /* 禁止滚动 */
    background-color: #000000;
  }
  
  .navbar, footer { display: none !important; }

  .landing-page {
    position: fixed;
    top: 0;
    left: 0;
    width: 100vw;
    height: 100vh;
    background-image: url('/assets/img/bg.jpg');
    background-size: cover; 
    background-position: center 30%; 
    background-repeat: no-repeat;
    
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    text-align: center;
    z-index: 1000;
  }

  .landing-title {
    font-size: 4rem;
    font-weight: bold;
    color: #ffffff;
    text-shadow: 2px 2px 4px rgba(0,0,0,0.8);
    margin-bottom: 0;
  }

  /* 按钮样式：黄色背景，白色文字 */
  .start-btn {
    display: inline-block;
    margin-top: 30px; 
    padding: 15px 40px;
    background-color: #ffc107; /* 黄色背景 */
    color: #ffffff; /* 白色文字 */
    font-size: 1.5rem;
    font-weight: bold;
    text-decoration: none;
    border-radius: 50px;
    transition: all 0.3s ease;
    border: 2px solid #ffc107;
  }

  /* 鼠标悬停时的效果：反色（白底黄字） */
  .start-btn:hover {
    background-color: #ffffff;
    color: #ffc107;
    text-decoration: none;
    transform: scale(1.05);
  }
</style>

<div class="landing-page">
  <div class="landing-title">欢迎来到SHY的世界</div>
  <a href="/diary" class="start-btn">打开我的日记本</a>
</div>
