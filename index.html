---
layout: default
---

<style>
  html, body {
    margin: 0 !important;
    padding: 0 !important;
    width: 100%;
    height: 100%;
    overflow: hidden; /* 禁止滚动 */
    background-color: #000000; /* 黑色背景，用来填充图片留白 */
  }
  
  .navbar, footer { display: none !important; }

  .landing-page {
    position: fixed;
    top: 0;
    left: 0;
    width: 100vw;
    height: 100vh;
    /* 核心修改：contain 保证原图完整显示，不裁剪 */
    background-image: url('/assets/img/bg.jpg');
    background-size: contain; 
    background-position: center;
    background-repeat: no-repeat;
    
    display: flex;
    flex-direction: column;
    justify-content: flex-start;
    align-items: center;
    text-align: center;
    padding-top: 80px;
    z-index: 1000;
    box-sizing: border-box;
  }

  .landing-title {
    font-size: 4rem;
    font-weight: bold;
    color: #ffffff;
    text-shadow: 2px 2px 4px rgba(0,0,0,0.8); /* 加阴影防看不清 */
    margin-bottom: 0;
  }

  .start-btn {
    display: inline-block;
    margin-top: 60px;
    padding: 15px 40px;
    background-color: rgba(0, 133, 161, 0.8);
    color: #ffffff;
    font-size: 1.5rem;
    font-weight: bold;
    text-decoration: none;
    border-radius: 50px;
    transition: all 0.3s ease;
    border: 2px solid #0085a1;
  }

  .start-btn:hover {
    background-color: #ffffff;
    color: #0085a1;
    text-decoration: none;
    transform: scale(1.05);
  }
</style>

<div class="landing-page">
  <div class="landing-title">欢迎来到SHY的世界</div>
  <a href="/diary" class="start-btn">打开我的日记本</a>
</div>
