---
layout: default
---

<style>
  html, body {
    margin: 0 !important;
    padding: 0 !important;
    width: 100%;
    height: 100%;
    overflow: hidden; /* 禁止滚动 */
    background-color: #000000;
  }
  
  .navbar, footer { display: none !important; }

  .landing-page {
    position: fixed;
    top: 0;
    left: 0;
    width: 100vw;
    height: 100vh;
    /* 这是最神奇的一句：自动放大铺满屏幕，多余部分自动藏起来 */
    background-image: url('/assets/img/bg.jpg');
    background-size: cover; 
    /* 镜头稍微偏上一点点，保证人物的脸和国旗在画面中央 */
    background-position: center 30%; 
    background-repeat: no-repeat;
    
    display: flex;
    flex-direction: column;
    justify-content: center; /* 文字和按钮居中 */
    align-items: center;
    text-align: center;
    z-index: 1000;
  }

  .landing-title {
    font-size: 4rem;
    font-weight: bold;
    color: #ffffff;
    text-shadow: 2px 2px 4px rgba(0,0,0,0.8);
    margin-bottom: 0;
  }

  .start-btn {
    display: inline-block;
    margin-top: 30px; 
    padding: 15px 40px;
    background-color: rgba(0, 133, 161, 0.8);
    color: #ffffff;
    font-size: 1.5rem;
    font-weight: bold;
    text-decoration: none;
    border-radius: 50px;
    transition: all 0.3s ease;
    border: 2px solid #0085a1;
  }

  .start-btn:hover {
    background-color: #ffffff;
    color: #0085a1;
    text-decoration: none;
    transform: scale(1.05);
  }
</style>

<div class="landing-page">
  <div class="landing-title">欢迎来到SHY的世界</div>
  <a href="/diary" class="start-btn">打开我的日记本</a>
</div>
