layout: default
---

<style>
  /* 1. 强制清除浏览器默认边距，并锁定宽高 */
  html, body {
    margin: 0 !important;
    padding: 0 !important;
    width: 100%;
    height: 100%;
    overflow: hidden; /* 禁止滑动 */
  }
  
  /* 2. 隐藏原生的导航栏和页脚 */
  .navbar, footer { display: none !important; }

  /* 3. 使用 fixed 定位，强行覆盖整个屏幕，彻底解决留白和右下角问题 */
  .landing-page {
    position: fixed;
    top: 0;
    left: 0;
    width: 100vw;
    height: 100vh;
    background-image: url('/assets/img/bg.jpg');
    background-size: cover;
    background-position: center;
    background-repeat: no-repeat;
    display: flex;
    flex-direction: column;
    justify-content: flex-start; /* 内容从上往下排列 */
    align-items: center;
    text-align: center;
    padding-top: 80px; /* 距离顶部留白 */
    z-index: 1000;
    box-sizing: border-box;
  }

  /* 4. 标题样式 */
  .landing-title {
    font-size: 4rem;
    font-weight: bold;
    color: #ffffff;
    text-shadow: 2px 2px 4px rgba(0,0,0,0.8);
    margin-bottom: 0;
  }

  /* 5. 按钮样式 */
  .start-btn {
    display: inline-block;
    margin-top: 60px;
    padding: 15px 40px;
    background-color: rgba(0, 133, 161, 0.8);
    color: #ffffff;
    font-size: 1.5rem;
    font-weight: bold;
    text-decoration: none;
    border-radius: 50px;
    transition: all 0.3s ease;
    border: 2px solid #0085a1;
  }

  .start-btn:hover {
    background-color: #ffffff;
    color: #0085a1;
    text-decoration: none;
    transform: scale(1.05);
  }
</style>

<div class="landing-page">
  <div class="landing-title">欢迎来到SHY的世界</div>
  <a href="/diary" class="start-btn">打开我的日记本</a>
</div>
