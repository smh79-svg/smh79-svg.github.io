---
layout: default
---

<style>
  /* 隐藏自带的导航栏和页脚，让页面更纯净 */
  .navbar, footer { display: none !important; }
  
  /* 背景图全屏设置 */
  .landing-page {
    background-image: url('/assets/img/bg.jpg');
    background-size: cover;
    background-position: center;
    background-repeat: no-repeat;
    height: 100vh; /* 铺满整个屏幕高度 */
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    text-align: center;
    color: #ffffff; /* 文字颜色，如果背景图是浅色，你可能需要改成 #000000 */
    text-shadow: 2px 2px 4px rgba(0,0,0,0.8); /* 文字阴影，防止背景太亮看不清字 */
  }
  
  .landing-title {
    font-size: 4rem;
    font-weight: bold;
    margin-bottom: 20px;
  }
  
  .landing-subtitle {
    font-size: 1.5rem;
    margin-bottom: 50px;
  }
  
  /* 开始游戏按钮样式 */
  .start-btn {
    display: inline-block;
    padding: 15px 40px;
    background-color: rgba(0, 133, 161, 0.8); /* 半透明蓝色 */
    color: #ffffff;
    font-size: 1.5rem;
    font-weight: bold;
    text-decoration: none;
    border-radius: 50px;
    transition: all 0.3s ease;
    border: 2px solid #0085a1;
  }
  
  .start-btn:hover {
    background-color: #ffffff;
    color: #0085a1;
    text-decoration: none;
    transform: scale(1.05); /* 鼠标悬停时微微放大 */
  }
</style>

<div class="landing-page">
  <div class="landing-title">欢迎来到SHY的世界</div>
  <div class="landing-subtitle">纯粹写日记</div>
  <a href="/diary" class="start-btn">开始游戏</a>
</div>
